[package]
name = "ely-gpui-component"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A restrained component library for GPUI, in light and dark."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["/src", "/tests", "/benches", "/README.md", "/LICENSE"]

[[test]]
name = "form"
required-features = ["test-support"]

[[test]]
name = "table"
required-features = ["test-support"]

[[test]]
name = "workspace"
required-features = ["test-support"]

[[bench]]
name = "budget"
harness = false
required-features = ["test-support"]

[features]
default = ["runtime_shaders", "fonts"]
fonts = ["ely-core/fonts"]
platform = ["ely-core/platform"]
runtime_shaders = ["ely-core/runtime_shaders"]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
ely-account.workspace = true
ely-agent.workspace = true
ely-calendar.workspace = true
ely-canvas.workspace = true
ely-charts.workspace = true
ely-chat.workspace = true
ely-collab.workspace = true
ely-core.workspace = true
ely-dashboard.workspace = true
ely-debug.workspace = true
ely-desktop.workspace = true
ely-devtools.workspace = true
ely-documents.workspace = true
ely-editor.workspace = true
ely-files.workspace = true
ely-finance.workspace = true
ely-generative.workspace = true
ely-git.workspace = true
ely-interaction.workspace = true
ely-mail.workspace = true
ely-maps.workspace = true
ely-media.workspace = true
ely-messaging.workspace = true
ely-misc.workspace = true
ely-onboarding.workspace = true
ely-project.workspace = true
ely-rendering.workspace = true
ely-settings.workspace = true
ely-terminal.workspace = true
ely-tooling.workspace = true
anyhow.workspace = true
gpui.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lints]
workspace = true

# The web gallery: small over fast, one unit so LTO sees everything.
