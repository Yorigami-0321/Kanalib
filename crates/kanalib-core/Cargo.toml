[package]
name = "kanalib-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
default = []
frame-profiler = []

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "6"
ignore = "0.4"
# AVIF decode in image 0.25 needs `avif-native` (dav1d, a native library), so
# AVIF stays on the ffmpeg path; the plain `avif` feature only adds an encoder.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "qoi", "exr"] }
kamadak-exif = "0.6"
log = "0.4"
notify = "8"
notify-debouncer-mini = "0.7"
rfd = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
walkdir = "2"
