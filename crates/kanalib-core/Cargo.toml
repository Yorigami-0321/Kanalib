[package]
name = "kanalib-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
default = []
frame-profiler = []

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
kamadak-exif = "0.6"
log = "0.4"
rfd = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
walkdir = "2"
