[package]
name = "kanalib-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kanalib-web"
path = "src/main.rs"

[[test]]
name = "web_flow"
path = "tests/web_flow.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
getrandom = "0.3"
hmac = { workspace = true }
http-body-util = "0.1"
kanalib-wall-model = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "net", "io-util", "fs", "time"] }
tokio-util = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
