[workspace]
members = [".", "crates/kanalib-core", "crates/kanalib-ui"]
exclude = ["vendor/ely-gpui-components", "vendor/gpui-pre-windows"]
resolver = "3"

[package]
name = "kanalib"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[[bin]]
name = "kanalib"
path = "src/main.rs"

[features]
# 取证档位：开启 gpui 的帧计时直方图，供 KANALIB_FRAME_METRICS 读取合成器帧间隔。
frame-profiler = [
    "kanalib-core/frame-profiler",
    "kanalib-ui/frame-profiler",
    "gpui/profiler",
]

[dependencies]
ely-gpui-component = { path = "vendor/ely-gpui-components" }
flexi_logger = "0.31"
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["stacker"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }
kanalib-core = { path = "crates/kanalib-core" }
kanalib-ui = { path = "crates/kanalib-ui" }
log = "0.4"

# F-039：单实例命名 mutex/事件只在 Windows GUI 进程使用；headless 不加载。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# 取证档：release 优化 + 行级符号，供分配器 backtrace 解析函数名。
[profile.probe]
inherits = "release"
debug = 1

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
