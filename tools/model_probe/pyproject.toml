[project]
name = "pixai-probe"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.6",
    "timm>=1.0.20",
    "pillow>=11",
    "numpy>=2",
    "safetensors>=0.5",
    "huggingface-hub>=0.34",
    "hf-transfer>=0.1.9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
